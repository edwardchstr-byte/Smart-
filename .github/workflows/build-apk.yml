name: Build Aria APK

on:
  workflow_dispatch:
    inputs:
      backendUrl:
        description: "Backend URL the app should call (e.g. https://your-server.example.com)"
        required: false
        default: "http://10.0.2.2:3000"
  push:
    branches:
      - claude/smart-devices-network-kbs0bf
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug -PbackendUrl="${{ github.event.inputs.backendUrl || 'http://10.0.2.2:3000' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
